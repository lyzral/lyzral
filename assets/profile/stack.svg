<svg width="560" height="32" viewBox="0 0 560 32" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">
  <!-- TypeScript -->
  <g>
    <rect x="0" y="2" width="112" height="28" rx="14" fill="#1a1033" stroke="#3d2a66"/>
    <rect x="12" y="9" width="14" height="14" rx="3" fill="#3178c6"/>
    <text x="22" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">TS</text>
    <text x="70" y="20" text-anchor="middle" fill="#d9c8ff">TypeScript</text>
  </g>
  <!-- React -->
  <g transform="translate(120,0)">
    <rect x="0" y="2" width="84" height="28" rx="14" fill="#1a1033" stroke="#3d2a66"/>
    <circle cx="19" cy="16" r="3" fill="#61dafb"/>
    <g fill="none" stroke="#61dafb" stroke-width="1.5">
      <ellipse cx="19" cy="16" rx="11" ry="4.3"/>
      <ellipse cx="19" cy="16" rx="11" ry="4.3" transform="rotate(60 19 16)"/>
      <ellipse cx="19" cy="16" rx="11" ry="4.3" transform="rotate(120 19 16)"/>
    </g>
    <text x="54" y="20" text-anchor="middle" fill="#d9c8ff">React</text>
  </g>
  <!-- Electron -->
  <g transform="translate(212,0)">
    <rect x="0" y="2" width="100" height="28" rx="14" fill="#1a1033" stroke="#3d2a66"/>
    <circle cx="18" cy="16" r="4.5" fill="#9feaf9"/>
    <g fill="none" stroke="#9feaf9" stroke-width="1.3">
      <ellipse cx="18" cy="16" rx="10" ry="4"/>
      <ellipse cx="18" cy="16" rx="10" ry="4" transform="rotate(60 18 16)"/>
      <ellipse cx="18" cy="16" rx="10" ry="4" transform="rotate(120 18 16)"/>
    </g>
    <text x="60" y="20" text-anchor="middle" fill="#d9c8ff">Electron</text>
  </g>
  <!-- Node.js -->
  <g transform="translate(320,0)">
    <rect x="0" y="2" width="98" height="28" rx="14" fill="#1a1033" stroke="#3d2a66"/>
    <path d="M18 8 L26 12.5 V21.5 L18 26 L10 21.5 V12.5 Z" fill="#5fa04e"/>
    <text x="58" y="20" text-anchor="middle" fill="#d9c8ff">Node.js</text>
  </g>
  <!-- Discord -->
  <g transform="translate(426,0)">
    <rect x="0" y="2" width="92" height="28" rx="14" fill="#1a1033" stroke="#3d2a66"/>
    <rect x="11" y="11" width="16" height="11" rx="5" fill="#5865F2"/>
    <circle cx="15" cy="16.5" r="1.6" fill="#1a1033"/>
    <circle cx="23" cy="16.5" r="1.6" fill="#1a1033"/>
    <text x="58" y="20" text-anchor="middle" fill="#d9c8ff">Discord</text>
